name: JS Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Run Jest
        run: npm run test:unit:js
