name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Get version from tag
        id: version
        run: |
          # Remove refs/tags/ prefix and v/V prefix
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          VERSION=${VERSION#V}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Validate version format
        run: |
          if ! [[ "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid version format. Expected: X.Y.Z or X.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi

      - name: Sync version from tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash bin/set-version.sh "${VERSION}"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "chore: sync version to ${VERSION}"
            echo "Committed version sync to ${VERSION}; release assets will be built from the corrected tree."
          else
            echo "Version already matches ${VERSION}; nothing to sync."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify the committed editor bundle matches a fresh build
        run: |
          if [ ! -f src/assets/build/editor.js ]; then
            echo "::error::src/assets/build/editor.js is missing. Run 'npm run build' and commit the result before tagging."
            exit 1
          fi
          npm ci
          npm run build
          if [ -n "$(git status --porcelain -- src/assets/build)" ]; then
            echo "::error::src/assets/build/ differs from a fresh 'npm run build'. Build and commit the result before tagging."
            git status --short -- src/assets/build
            exit 1
          fi

      - name: Install dependencies (production only)
        run: composer install --prefer-dist --no-dev --no-progress --optimize-autoloader

      - name: Create distribution package
        run: |
          mkdir -p dist/cassette-cmf-block-builder

          # Everything the repository has, minus what .distignore lists. The
          # production vendor/ (installed with --no-dev above) and languages/
          # are part of the package; the JS source (src/assets/src/) and the
          # dev/test files are in .distignore.
          rsync -a --exclude='/dist/' --exclude-from=.distignore ./ dist/cassette-cmf-block-builder/

          # Sanity checks: what must ship, and what must not.
          for required in src/assets/build/editor.js composer.json README.md LICENSE vendor/autoload.php languages; do
            if [ ! -e "dist/cassette-cmf-block-builder/${required}" ]; then
              echo "::error::${required} is missing from the package."
              exit 1
            fi
          done
          for forbidden in src/assets/src tests node_modules package.json composer.lock .github; do
            if [ -e "dist/cassette-cmf-block-builder/${forbidden}" ]; then
              echo "::error::${forbidden} must not be in the package (see .distignore)."
              exit 1
            fi
          done

          cd dist

          # Create zip archive
          zip -r ../cassette-cmf-block-builder-${{ steps.version.outputs.version }}.zip cassette-cmf-block-builder

          # Create tarball
          tar -czf ../cassette-cmf-block-builder-${{ steps.version.outputs.version }}.tar.gz cassette-cmf-block-builder

          cd ..

          # Show what's included
          echo "Package contents:"
          unzip -l cassette-cmf-block-builder-${{ steps.version.outputs.version }}.zip | head -50

      - name: Generate release notes
        id: release_notes
        run: |
          # Extract notes from CHANGELOG.md if it exists
          if [ -f CHANGELOG.md ]; then
            # Extract section for current version
            NOTES=$(awk '/^## \[?${{ steps.version.outputs.version }}\]?/{flag=1; next} /^## \[?[0-9]+\.[0-9]+\.[0-9]+\]?/{flag=0} flag' CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "notes=Release ${{ steps.version.outputs.tag }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "notes=Release ${{ steps.version.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release if present
        run: |
          # Check if release exists and delete it (handles immutable releases)
          if gh release view ${{ steps.version.outputs.tag }} &>/dev/null; then
            echo "Deleting existing release..."
            gh release delete ${{ steps.version.outputs.tag }} --yes --cleanup-tag=false
            sleep 5  # Wait for GitHub API to propagate deletion
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Cassette-CMF Blocks ${{ steps.version.outputs.tag }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            cassette-cmf-block-builder-${{ steps.version.outputs.version }}.zip
            cassette-cmf-block-builder-${{ steps.version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          echo "- cassette-cmf-block-builder-${{ steps.version.outputs.version }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- cassette-cmf-block-builder-${{ steps.version.outputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
